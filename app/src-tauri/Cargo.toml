[package]
name = "snapit"
version = "0.1.7"
edition = "2021"
description = "SnapIT — own your photo library. Local-first, on-device AI, one-off purchase."
authors = ["VF Empire Corp Ltd <security@vfempire.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/vfempire-hq/snapit-desktop"

[lib]
name = "snapit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri v2 ---
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# --- catalog: SQLite + JSON serialisation ---
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- storage / filesystem ---
walkdir = "2"
notify = "6"
dirs = "5"

# --- imagery ---
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
kamadak-exif = "0.5"
sha2 = "0.10"
blake3 = "1"
hex = "0.4"

# --- concurrency ---
tokio = { version = "1", features = ["full"] }
rayon = "1"
crossbeam-channel = "0.5"

# --- error handling ---
anyhow = "1"
thiserror = "1"

# --- config + logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- id generation ---
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

# --- licence verification (Ed25519 offline) ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"

# --- profile PIN hashing (Argon2id — safe modern default) ---
argon2 = "0.5"
rand = "0.8"

# --- shared VF privacy primitives (later refactor to @vf/privacy-kit dep) ---
# vf-privacy-kit = { path = "../../vf-privacy-kit/crates/vf-privacy-kit" }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
